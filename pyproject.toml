[project]
name = "dynamic-portfolio-allocation"
version = "0.1.0"
description = "India VIX-based dynamic NIFTY 50 allocation: strategy design, backtesting and risk-adjusted evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "streamlit>=1.65.0",
    "yfinance>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
